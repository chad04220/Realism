# Realism settings (copied next to the executable). Your changes made in-game
# are saved to %APPDATA%\Realism\settings.cfg, which overrides this file.
# 0.02-0.025 m: content has features (terminals, motor windings) thinner than
# 3 cm, so coarser worlds cannot represent every part faithfully.
voxel_size = 0.025
world_x = 16
world_y = 8
world_z = 16
thermal_warp = 20
threads = 0
width = 1600
height = 900
fullscreen = 0
vsync = 1
render_scale = 1
smooth_surfaces = 1
shadows = 1
bloom = 1
# Ray-marched smoke, steam and heat haze from the air simulation
volumetrics = 1
fov = 72
exposure = 1
ui_scale = 1
mouse_sensitivity = 1
invert_y = 0
volume = 0.8
