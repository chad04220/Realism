name: build

on:
  push:
  pull_request:

jobs:
  linux-headless-tests:
    name: Linux headless self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DREALISM_HEADLESS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run the simulation self-test
        run: ./build/Realism --selftest

  windows-build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
